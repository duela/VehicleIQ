services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vehicleiq
      POSTGRES_USER: vehicleiq
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-vehicleiq-local}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehicleiq -d vehicleiq"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
  minio-init:
    image: minio/mc:RELEASE.2025-02-08T19-14-21Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: ["until mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin}; do sleep 2; done && mc mb --ignore-existing local/vehicleiq-evidence"]

  core:
    build:
      context: .
      dockerfile: Dockerfile.core
    environment:
      SPRING_PROFILES_ACTIVE: compose
      DATABASE_URL: jdbc:postgresql://postgres:5432/vehicleiq
      DATABASE_USER: vehicleiq
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-vehicleiq-local}
      REDIS_URL: redis://redis:6379
      EVENT_MODE: redis
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploy-vehicleiq}
      WORKER_TOKEN: ${WORKER_TOKEN:-local-worker-token-change-before-deploy}
      S3_ENABLED: "true"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: eu-west-2
      S3_BUCKET: vehicleiq-evidence
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 4s
      retries: 20

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    environment:
      PORT: 4000
      CORE_URL: http://core:8080
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploy-vehicleiq}
      WORKER_TOKEN: ${WORKER_TOKEN:-local-worker-token-change-before-deploy}
      DEMO_API_KEY: ${DEMO_API_KEY:-viq_demo_local_only_7f0c3e91}
      ENABLE_DEMO_AUTH: "true"
      NODE_ENV: development
    depends_on:
      core:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    command: ["node", "gateway/dist/worker.js"]
    environment:
      CORE_URL: http://core:8080
      REDIS_URL: redis://redis:6379
      EVENT_MODE: redis
      WORKER_TOKEN: ${WORKER_TOKEN:-local-worker-token-change-before-deploy}
    depends_on:
      core:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${APP_PORT:-8088}:80"
    depends_on:
      - gateway

volumes:
  pg_data:
  redis_data:
  minio_data:
